<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Student Loop</title>
</head>
<body>
</body>
<style>
    * {
        box-sizing: border-box;
    }

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 40px;
        background-color: rgb(230, 219, 219);
    }

    .container {
        width: 550px;
        margin: auto;
        padding: 30px;
        background: wheat;
        border-radius: 10px;
        box-shadow: 0 4px 12px black;
    }

    h1 {
        text-align: center;
        color: black;
    }

    p {
        text-align: center;
        color: gray;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 5px;
        font-weight: bold;
    }

    input {
        width: 100%;
        padding: 11px;
        border: 1px solid black;
        border-radius: 5px;
    }

    button {
        width: 100%;
        margin-top: 20px;
        padding: 12px;
        border: none;
        border-radius: 5px;
        background-color: red;
        color: blanchedalmond;
        font-size: 16px;
        cursor: pointer;
    }

    .student-box {
        width: 850px;
        max-width: 100%;
        margin: 25px auto;
        padding: 20px;
        background: wheat;
        border-radius: 10px;
        box-shadow: 0 4px 12px whitesmoke;
    }

    table {
        width: 100%;
        border-collapse: collapse;
    }

    th {
        padding: 12px;
        background-color: rgb(73, 73, 106);
        color: white;
    }

    td {
        padding: 12px;
        text-align: center;
        border-bottom: 1px solid whitesmoke;
    }
</style>
<div class="container">

    <h1> Information  student</h1>

    <p> Enter information about student in box</p>

    <label>Name</label>
    <input type="text" id="name" placeholder="Enter name">

    <label>Age</label>
    <input type="number" id="age" placeholder="Enter age">

    <label>Major</label>
    <input type="text" id="major" placeholder="Enter major">

    <label>Color</label>
    <input type="text" id="color" placeholder="Enter favorite color">

    <button onclick="addStudent()">
        Add other Student
    </button>

</div>


<div class="student-box">

    <h2>Student List</h2>

    <table>

        <thead>
            <tr>
                <th>No</th>
                <th>Name</th>
                <th>Age</th>
                <th>Major</th>
                <th>Color</th>
            </tr>
        </thead>

        <tbody id="studentTable">
        </tbody>

    </table>

</div>


<script>

    // Store student information
    let students = [];


    // Add Student
    function addStudent() {

        let name = document.getElementById("name").value;
        let age = document.getElementById("age").value;
        let major = document.getElementById("major").value;
        let color = document.getElementById("color").value;


        if (name === "" || age === "" ||
            major === "" || color === "") {

            alert("Please fill in all information!");
            return;
        }


        students.push({
            name: name,
            age: age,
            major: major,
            color: color
        });


        displayStudents();


        // Clear input
        document.getElementById("name").value = "";
        document.getElementById("age").value = "";
        document.getElementById("major").value = "";
        document.getElementById("color").value = "";
    }


    // Display Students
    function displayStudents() {

        let table =
            document.getElementById("studentTable");

        table.innerHTML = "";


        // FOR LOOP
        for (let i = 0; i < students.length; i++) {

            table.innerHTML += `
                <tr>
                    <td>${i + 1}</td>
                    <td>${students[i].name}</td>
                    <td>${students[i].age}</td>
                    <td>${students[i].major}</td>
                    <td>${students[i].color}</td>
                </tr>
            `;
        }
    }

</script>
